services:
  # 負荷分散を行うロードバランサー（入口）
  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

  # スケールさせるWebサーバー
  web:
    image: hashicorp/http-echo
    command: ["-text", "Hello! This is response from container."]