services:
  web-server:
    image: nginx:alpine
    container_name: my-web-server
    ports:
      - "8080:80"
    volumes:
      - shared-storage:/usr/share/nginx/html

  client-node:
    image: alpine
    container_name: my-client
    tty: true
    command: sh -c "apk add --no-cache curl && sh"
    volumes:
      - shared-storage:/data/shared

volumes:
  shared-storage: